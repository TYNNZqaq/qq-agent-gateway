<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172c27">
  <title>QQ Agent · 本机管理台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" data-nav="overview" aria-label="QQ Agent 管理台首页"><span class="brand-symbol">q<span>·</span></span><span>QQ Agent<small>本机管理台</small></span></a>
      <div class="workspace-label"><span class="workspace-avatar">L</span><span>我的本机网关<small>本地工作空间</small></span><span class="workspace-lock" aria-hidden="true">⌁</span></div>
      <div class="nav-caption">工作空间</div>
      <nav aria-label="主导航">
        <button data-nav="overview" class="nav-item active" aria-current="page"><span data-icon="grid"></span>总览</button>
        <button data-nav="bots" class="nav-item"><span data-icon="bot"></span>QQ 机器人<span id="nav-bot-count" class="nav-count">0</span></button>
        <button data-nav="agents" class="nav-item"><span data-icon="layers"></span>Agent 实例<span id="nav-agent-count" class="nav-count">0</span></button>
        <button data-nav="tools" class="nav-item"><span data-icon="puzzle"></span>工具状态</button>
        <button data-nav="connections" class="nav-item"><span data-icon="shield"></span>接入</button>
        <button data-nav="activity" class="nav-item"><span data-icon="clock"></span>活动记录</button>
      </nav>
      <div class="sidebar-bottom"><div class="single-install"><span data-icon="link"></span><strong>一个网关，统一管理</strong><p>无需在每个 Agent 中分别安装插件。</p></div><button class="nav-item" data-action="settings"><span data-icon="settings"></span>本机设置</button><div class="service-state"><span id="service-dot" class="dot"></span><span id="service-text">正在连接管理台</span><span>G1</span></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">工作空间<span>/</span><strong id="breadcrumb-current">总览</strong></div><div class="topbar-right"><span class="local-badge"><span class="dot"></span>仅本机访问</span><button class="icon-button" data-action="help" aria-label="查看使用说明"><span data-icon="help"></span></button><span class="user-avatar" title="本机用户">本</span></div></header>
      <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span>正在加载本机工作空间…</div></main>
      <footer class="page-footer"><span>QQ Agent Gateway <span class="footer-divider">/</span> G1 基础构造</span><span>本机管理 · 配置独立保存</span></footer>
    </div>
  </div>
  <dialog id="editor-dialog" aria-labelledby="dialog-title"><form id="editor-form"><div class="dialog-heading"><div><span class="eyebrow">本机工作空间</span><h2 id="dialog-title"></h2><p id="dialog-subtitle"></p></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭对话框"><span data-icon="close"></span></button></div><div id="dialog-fields"></div><p id="form-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog">取消</button><button id="dialog-submit" class="button primary" type="submit">保存</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
